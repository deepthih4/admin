<style>

/* =========================================================
   RESET
========================================================= */

/* =========================================================

.type-label{

.required{

.type-grid{

}

========================================================= */

.field input,

.field input{

.field input:focus,

<script>

/* =========================================================
   SUPABASE KEYS
========================================================= */


/*
   BRO, IKKADA NEE NEW SUPABASE VALUES PASTE CHEYYI.

   Supabase:
   Project Settings
       ↓
   API

   Copy:
   Project URL
   Publishable key / anon key


   SERVICE ROLE KEY USE CHEYYAKU.
*/


const SUPABASE_URL =
    "https://wqduicdjhrlhckkahwjt.supabase.co/";


const SUPABASE_ANON_KEY =
    "sb_publishable_zhMlESulGJdiiKA0MhKZPQ_I0VgenF8";


/* =========================================================
   SUPABASE CLIENT
========================================================= */

const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );


/* =========================================================
   STORAGE BUCKET
========================================================= */

const LOGO_BUCKET =
    "institution-logos";


/* =========================================================
   VARIABLES
========================================================= */

let selectedInstitutionType =
    "School";


let selectedLogoFile =
    null;


/* =========================================================
   SELECT SCHOOL / COLLEGE
========================================================= */

function selectType(type){

    selectedInstitutionType =
        type;


    document
        .getElementById("schoolCard")
        .classList.toggle(
            "active",
            type === "School"
        );


    document
        .getElementById("collegeCard")
        .classList.toggle(
            "active",
            type === "College"
        );


    document
        .getElementById("logoDefaultIcon")
        .textContent =
            type === "School"
                ? "🏫"
                : "🎓";

}


/* =========================================================
   LOGO SELECT
========================================================= */

function handleLogo(event){

    const file =
        event.target.files[0];


    if(!file){

        return;

    }


    /*
       No 5MB restriction.
       No JPG-only restriction.
       Browser image/* allowed.
    */

    selectedLogoFile =
        file;


    const reader =
        new FileReader();


    reader.onload =
        function(e){

            document
                .getElementById(
                    "logoPreview"
                )
                .src =
                    e.target.result;


            document
                .getElementById(
                    "logoPlaceholder"
                )
                .style.display =
                    "none";


            document
                .getElementById(
                    "logoPreviewBox"
                )
                .style.display =
                    "flex";

        };


    reader.readAsDataURL(
        file
    );

}


/* =========================================================
   REMOVE LOGO
========================================================= */

function removeLogo(){

    selectedLogoFile =
        null;


    document
        .getElementById(
            "logoInput"
        )
        .value =
            "";


    document
        .getElementById(
            "logoPreview"
        )
        .src =
            "";


    document
        .getElementById(
            "logoPreviewBox"
        )
        .style.display =
            "none";


    document
        .getElementById(
            "logoPlaceholder"
        )
        .style.display =
            "block";

}


/* =========================================================
   GENERATE INSTITUTION ID
========================================================= */

async function generateInstitutionId(type){

    const prefix =
        type === "School"
            ? "SCH"
            : "CLG";


    const {
        data,
        error
    } =
        await supabaseClient
        .from("institutions")
        .select(
            "institution_id"
        )
        .eq(
            "institution_type",
            type
        );


    if(error){

        throw new Error(
            "Unable to generate institution ID: " +
            error.message
        );

    }


    let highestNumber =
        0;


    if(data){

        data.forEach(
            function(row){

                const currentId =
                    row.institution_id ||
                    "";


                if(
                    currentId.startsWith(
                        prefix
                    )
                ){

                    const number =
                        parseInt(
                            currentId.substring(
                                prefix.length
                            ),
                            10
                        );


                    if(
                        !isNaN(number) &&
                        number > highestNumber
                    ){

                        highestNumber =
                            number;

                    }

                }

            }
        );

    }


    return (
        prefix +
        String(
            highestNumber + 1
        ).padStart(
            4,
            "0"
        )
    );

}


/* =========================================================
   CHECK EMAIL
========================================================= */

async function checkEmailExists(email){

    const {
        data,
        error
    } =
        await supabaseClient
        .from("institutions")
        .select("id")
        .eq(
            "email",
            email
        )
        .limit(1);


    if(error){

        throw new Error(
            "Email check failed: " +
            error.message
        );

    }


    return (
        data &&
        data.length > 0
    );

}


/* =========================================================
   UPLOAD LOGO
========================================================= */

async function uploadInstitutionLogo(
    institutionId
){

    if(!selectedLogoFile){

        return null;

    }


    let extension =
        "img";


    if(
        selectedLogoFile.name &&
        selectedLogoFile.name.includes(".")
    ){

        extension =
            selectedLogoFile.name
                .split(".")
                .pop()
                .toLowerCase();

    }


    const fileName =
        "logo-" +
        Date.now() +
        "." +
        extension;


    const filePath =
        institutionId +
        "/" +
        fileName;


    const {
        error
    } =
        await supabaseClient
        .storage
        .from(
            LOGO_BUCKET
        )
        .upload(
            filePath,
            selectedLogoFile,
            {
                cacheControl:
                    "3600",

                upsert:
                    false
            }
        );


    if(error){

        throw new Error(
            "Logo upload failed: " +
            error.message
        );

    }


    const {
        data
    } =
        supabaseClient
        .storage
        .from(
            LOGO_BUCKET
        )
        .getPublicUrl(
            filePath
        );


    if(
        !data ||
        !data.publicUrl
    ){

        throw new Error(
            "Logo URL could not be generated."
        );

    }


    return data.publicUrl;

}


/* =========================================================
   SAVE INSTITUTION
========================================================= */

async function saveInstitution(){

    const saveBtn =
        document.getElementById(
            "saveBtn"
        );


    try{

        hideMessage();


        /* ----------------------------------------------
           GET FORM VALUES
        ---------------------------------------------- */

        const institutionName =
            document
            .getElementById(
                "institutionName"
            )
            .value
            .trim();


        const branch =
            document
            .getElementById(
                "branch"
            )
            .value
            .trim();


        const mobile =
            document
            .getElementById(
                "mobile"
            )
            .value
            .trim();


        const email =
            document
            .getElementById(
                "email"
            )
            .value
            .trim()
            .toLowerCase();


        const address =
            document
            .getElementById(
                "address"
            )
            .value
            .trim();


        /* ----------------------------------------------
           VALIDATION
        ---------------------------------------------- */

        if(!institutionName){

            showMessage(
                "Please enter institution name.",
                "error"
            );

            return;

        }


        if(!email){

            showMessage(
                "Please enter institution email.",
                "error"
            );

            return;

        }


        if(
            mobile &&
            mobile.length < 10
        ){

            showMessage(
                "Please enter a valid mobile number.",
                "error"
            );

            return;

        }


        /* ----------------------------------------------
           BUTTON
        ---------------------------------------------- */

        saveBtn.disabled =
            true;


        saveBtn.textContent =
            "Checking...";


        /* ----------------------------------------------
           DUPLICATE EMAIL
        ---------------------------------------------- */

        const emailExists =
            await checkEmailExists(
                email
            );


        if(emailExists){

            showMessage(
                "This institution email is already registered.",
                "error"
            );

            return;

        }


        /* ----------------------------------------------
           GENERATE ID
        ---------------------------------------------- */

        saveBtn.textContent =
            "Generating ID...";


        const institutionId =
            await generateInstitutionId(
                selectedInstitutionType
            );


        /* ----------------------------------------------
           LOGO UPLOAD
        ---------------------------------------------- */

        let logoUrl =
            null;


        if(selectedLogoFile){

            saveBtn.textContent =
                "Uploading Logo...";


            logoUrl =
                await uploadInstitutionLogo(
                    institutionId
                );

        }


        /* ----------------------------------------------
           DATABASE INSERT
        ---------------------------------------------- */

        saveBtn.textContent =
            "Saving...";


        const {
            data,
            error
        } =
            await supabaseClient
            .from("institutions")
            .insert({

                institution_id:
                    institutionId,

                institution_type:
                    selectedInstitutionType,

                institution_name:
                    institutionName,

                mobile:
                    mobile || null,

                email:
                    email,

                branches:
                    branch || null,

                address:
                    address || null,

                logo_url:
                    logoUrl,

                status:
                    "active"

            })
            .select()
            .single();


        if(error){

            throw new Error(
                "Database save failed: " +
                error.message
            );

        }


        console.log(
            "Institution created:",
            data
        );


        /* ----------------------------------------------
           SHOW RESULT
        ---------------------------------------------- */

        document
            .getElementById(
                "createdInstitutionId"
            )
            .textContent =
                institutionId;


        document
            .getElementById(
                "createdInstitutionType"
            )
            .textContent =
                selectedInstitutionType;


        document
            .getElementById(
                "createdResult"
            )
            .style.display =
                "grid";


        showMessage(
            "Institution created successfully. Institution ID: " +
            institutionId,
            "success"
        );


        /* ----------------------------------------------
           CLEAR FORM
        ---------------------------------------------- */

        clearForm();

    }
    catch(error){

        console.error(
            "CREATE INSTITUTION ERROR:",
            error
        );


        showMessage(
            error.message ||
            "Something went wrong.",
            "error"
        );

    }
    finally{

        saveBtn.disabled =
            false;


        saveBtn.textContent =
            "Save Institution";

    }

}

/* =========================================================
   RESET FORM
========================================================= */

function resetForm(){

    clearForm();


    document
        .getElementById(
            "createdResult"
        )
        .style.display =
            "none";


    hideMessage();


    selectType(
        "School"
    );

}


/* =========================================================
   SHOW MESSAGE
========================================================= */

function showMessage(
    text,
    type
){

    const message =
        document.getElementById(
            "message"
        );


    message.textContent =
        text;


    message.className =
        "message " +
        type;


    window.scrollTo({

        top:0,

        behavior:"smooth"

    });

}


/* =========================================================
   HIDE MESSAGE
========================================================= */

function hideMessage(){

    const message =
        document.getElementById(
            "message"
        );


    message.textContent =
        "";


    message.className =
        "message";

}


/* =========================================================

selectType(

);
